<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#5b3fb5" />
  <meta name="description" content="عالم الاستكشاف السحري — تطبيق مغامرات تعليمي للأطفال" />
  <title>🦁 Safari Kids Adventure — عالم الاستكشاف السحري</title>

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/map.css" />
  <link rel="stylesheet" href="/css/games.css" />
</head>
<body>
  <!-- شاشة البداية -->
  <div id="splash" class="splash">
    <div class="splash-sun">☀️</div>
    <div class="splash-logo">🦁</div>
    <div id="splashMizo" class="splash-mizo" aria-hidden="true"></div>
    <h1 class="splash-title">عالم الاستكشاف السحري</h1>
    <p class="splash-sub">Safari Kids Adventure</p>
    <button id="startBtn" class="big-start-btn">▶ ابدأ المغامرة</button>
    <div class="splash-clouds" aria-hidden="true">
      <span class="cloud c1">☁️</span>
      <span class="cloud c2">☁️</span>
      <span class="cloud c3">☁️</span>
    </div>
  </div>

  <!-- الحاوية الرئيسية للتطبيق -->
  <main id="app" class="app hidden" aria-live="polite"></main>

  <!-- طبقة المؤثرات (نجوم/قصاصات) -->
  <canvas id="fx" class="fx-layer"></canvas>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
